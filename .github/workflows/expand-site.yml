name: Expand RightsRadar source

on:
  push:
    paths:
      - site.tar.gz
      - .bundle-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand site bundle
        run: |
          tar -xzf site.tar.gz -C .
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Expand RightsRadar site source"
          git push
