name: Import RightsRadar source

on:
  push:
    paths:
      - .bundle-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import live RightsRadar static files
        shell: bash
        run: |
          set -euo pipefail
          base="https://rightsradar-uk-three.vercel.app"
          files=(
            "index.html|/"
            "scotland-rights.html|/scotland-rights.html"
            "new-laws.html|/new-laws.html"
            "about.html|/about.html"
            "privacy.html|/privacy.html"
            "terms.html|/terms.html"
            "robots.txt|/robots.txt"
            "sitemap.xml|/sitemap.xml"
            "assets/styles.css|/assets/styles.css"
            "assets/app.js|/assets/app.js"
            "guides/answering-police-questions-scotland.html|/guides/answering-police-questions-scotland.html"
            "guides/appropriate-adult-scotland.html|/guides/appropriate-adult-scotland.html"
            "guides/arrest-powers-scotland.html|/guides/arrest-powers-scotland.html"
            "guides/charged-crime-scotland.html|/guides/charged-crime-scotland.html"
            "guides/complain-police-scotland.html|/guides/complain-police-scotland.html"
            "guides/criminal-court-scotland.html|/guides/criminal-court-scotland.html"
            "guides/criminal-legal-aid-scotland.html|/guides/criminal-legal-aid-scotland.html"
            "guides/criminal-plea-scotland.html|/guides/criminal-plea-scotland.html"
            "guides/custody-contact-scotland.html|/guides/custody-contact-scotland.html"
            "guides/custody-scotland.html|/guides/custody-scotland.html"
            "guides/custody-time-scotland.html|/guides/custody-time-scotland.html"
            "guides/fingerprints-dna-scotland.html|/guides/fingerprints-dna-scotland.html"
            "guides/investigative-liberation-scotland.html|/guides/investigative-liberation-scotland.html"
            "guides/medical-interpreter-custody-scotland.html|/guides/medical-interpreter-custody-scotland.html"
            "guides/stop-search-record-scotland.html|/guides/stop-search-record-scotland.html"
            "guides/stop-search-scotland.html|/guides/stop-search-scotland.html"
            "guides/undertaking-scotland.html|/guides/undertaking-scotland.html"
            "guides/young-vulnerable-custody-scotland.html|/guides/young-vulnerable-custody-scotland.html"
          )
          for item in "${files[@]}"; do
            out="${item%%|*}"
            url="${item#*|}"
            mkdir -p "$(dirname "$out")"
            curl --fail --silent --show-error --location "$base$url" --output "$out"
          done
          grep -RIl 'rightsradaruk-wotex1989-8654.vercel.app' . --exclude-dir=.git | xargs -r sed -i 's#https://rightsradaruk-wotex1989-8654.vercel.app#https://rightsradar-uk-three.vercel.app#g'
          rm -f site.tar.gz
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import full RightsRadar source"
          git push
