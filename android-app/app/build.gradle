plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeyAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
def releaseStorePassword = System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : null
def hasReleaseSigning = releaseKeystoreFile != null && releaseKeystoreFile.exists() && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'uk.rightsradar.app'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.rightsradar.app'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
