<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>RightsRadar UK — Offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .offline-shell{min-height:100vh;display:grid;place-items:center;padding:32px}
    .offline-card{width:min(680px,100%);background:#0f1622;border:1px solid #243247;border-radius:22px;padding:32px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.35)}
    .offline-card h1{margin:10px 0 12px;font-size:clamp(2rem,7vw,3.6rem)}
    .offline-card p{color:#9aa8bd}
    .offline-icon{font-size:3rem}
  </style>
</head>
<body>
  <main class="offline-shell">
    <section class="offline-card">
      <div class="offline-icon">📡</div>
      <span class="eyebrow">RightsRadar UK</span>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet for the latest legal information. Pages you already opened may still be available from the app cache.</p>
      <p class="small">For urgent legal matters, do not rely on an offline copy if the law or official guidance may have changed.</p>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    </section>
  </main>
</body>
</html>
