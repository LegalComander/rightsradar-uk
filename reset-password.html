<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Reset password | RightsRadar UK</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/theme.css?v=20260916c">
<style>body{min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(61,114,232,.15),transparent 35%),#050a12}.reset-wrap{width:min(520px,92vw);margin:9vh auto}.reset-card{background:linear-gradient(160deg,rgba(17,29,48,.98),rgba(7,14,25,.98));border:1px solid #304b72;border-radius:24px;padding:28px;box-shadow:0 35px 100px rgba(0,0,0,.45)}.reset-card h1{margin:0 0 8px}.reset-card p{color:#9fb0c6}.reset-card label{display:block;font-weight:800;font-size:.85rem;margin:16px 0 6px}.reset-card input{width:100%;box-sizing:border-box;background:#07111e;color:#fff;border:1px solid #30435e;border-radius:12px;padding:13px;font:inherit}.reset-card .btn{width:100%;margin-top:18px}.reset-status{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#10251f;border:1px solid #234b3d;color:#9ee0c1}.reset-status.error{background:#2b1619;border-color:#603038;color:#f2c4ca}.back{display:inline-block;margin-top:18px;color:#9cc9ff}</style>
</head><body><main class="reset-wrap"><section class="reset-card"><div class="small">RIGHTSRADAR ACCOUNT SECURITY</div><h1>Choose a new password</h1><p id="intro">Enter a new password for your email/password account.</p><form id="resetForm"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="btn btn-primary" type="submit">Reset password</button></form><div id="status" class="reset-status" aria-live="polite"></div><a class="back" href="community.html#login">← Back to sign in</a></section></main>
<script>
(()=>{const form=document.getElementById('resetForm'),status=document.getElementById('status'),intro=document.getElementById('intro');const q=new URLSearchParams(location.search),token=q.get('token'),error=q.get('error');function show(msg,bad=false){status.style.display='block';status.className='reset-status'+(bad?' error':'');status.textContent=msg}if(error||!token){form.hidden=true;intro.textContent='This password reset link is invalid or has expired.';show('Request a new password reset link from the sign-in window.',true);return}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){show('Passwords do not match.',true);return}if(password.length<8||password.length>128){show('Password must be between 8 and 128 characters.',true);return}const btn=form.querySelector('button');btn.disabled=true;show('Resetting password…');try{const r=await fetch('/api/auth',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reset-password',token,newPassword:password})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Unable to reset password.');form.reset();form.hidden=true;intro.textContent='Your password has been changed.';show('Password reset successfully. You can now sign in with your new password.')}catch(err){show(err.message,true);btn.disabled=false}})})();
</script></body></html>
